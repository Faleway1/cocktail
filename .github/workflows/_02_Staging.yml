name: 02 - Staging

on:
  push:
    branches:
      - develop
      - release/*

jobs:
  Display_Data:
    runs-on: ubuntu-latest
    steps:
      - run: env | sort

  Build_Push_docker:
    if: ${{ github.ref_name == 'develop'}}
    uses: ./.github/workflows/z_Docker-Ghcr.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      docker-mode: canary

