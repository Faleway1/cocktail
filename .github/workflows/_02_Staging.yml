name: 02 - Staging

on:
  push:
    branches:
      - develop
      - release/*

jobs:
  Display_Data:
    runs-on: ubuntu-latest
    steps:
      - run: env | sort

  Build_Push_docker:
    if: ${{ github.ref_name == 'developp'}}
    uses: ./.github/workflows/z_Docker-Ghcr.yml
    secrets: inherit
    with:
      docker-mode: canary

  Trivy_scan:
    needs: [Build_Push_docker]
    uses: ./.github/workflows/02-2_TrivyScan.yml
    secrets: inherit
